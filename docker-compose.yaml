services:
  catalog-db:
    image: postgres:15-alpine
    container_name: catalog-db
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - catalog-db:/var/lib/postgresql/data
    networks:
      - ecommerce-network
  identity-db:
    image: postgres:15-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5439:5432
    volumes:
      - identity-db:/var/lib/postgresql/data
    networks:
      - ecommerce-network
        
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","ping"]
      interval: 10s
      timeout: 5s
  catalog-api:
    build:
      context: .
      dockerfile: Services/Catalog-service/Catalog.API/Dockerfile
    container_name: catalog-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=catalog-db;Port=5432;Database=catalog_db;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ECommercePlatform
      - Jwt__Audience=ECommercePlatform
    ports:
      - 5001:8080
    depends_on:
      - catalog-db
      - rabbitmq
    networks:
      - ecommerce-network
  
  identity-api:
    build:
      context: .
      dockerfile: Services/Identity.Services/Identity.Api/Dockerfile
    container_name: identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=identity-db;Port=5432;Database=identity_db;Username=postgres;Password=postgres
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=ECommercePlatform
      - Jwt__Audience=ECommercePlatform
      - Jwt__ExpirationsMinutes=60
    ports:
      - 5008:8080
    depends_on:
      - catalog-db
      - rabbitmq
    networks:
      - ecommerce-network    
    
    
    
    
volumes:
  catalog-db:
  rabbitmq_data:
  identity-db:
    
networks:
  ecommerce-network:
    driver: bridge